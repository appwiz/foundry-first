<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 960 380" width="960" role="img"
     aria-label="Call path for one prompt: three seeded local samples are scored for agreement, and a threshold gate sends the prompt either to a local answer or to claude-opus-5 with the drafts attached."
     color="#1f2328"
     font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How one prompt is routed between the local and frontier tiers</title>

  <defs>
    <marker id="a-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="a-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/>
    </marker>
    <marker id="a-frontier" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.4">
    <rect x="20" y="174" width="76" height="40" rx="6"/>
    <rect x="452" y="164" width="150" height="60" rx="8"/>
    <path d="M700 146 L764 194 L700 242 L636 194 Z"/>
  </g>

  <!-- local tier container -->
  <rect x="130" y="86" width="270" height="226" rx="10"
        fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.28"
        stroke-width="1.4" stroke-dasharray="5 4"/>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.35">
    <rect x="148" y="140" width="234" height="32" rx="6"/>
    <rect x="148" y="178" width="234" height="32" rx="6"/>
    <rect x="148" y="216" width="234" height="32" rx="6"/>
  </g>

  <!-- outcome boxes -->
  <rect x="790" y="84" width="150" height="52" rx="8" fill="none" stroke="#2f9e44" stroke-width="1.6"/>
  <rect x="790" y="262" width="150" height="52" rx="8" fill="none" stroke="#d97706" stroke-width="1.6"/>
  <rect x="560" y="352" width="380" height="74" rx="8" fill="none" stroke="#d97706" stroke-width="1.4"
        stroke-opacity="0.7" stroke-dasharray="5 4"/>

  <!-- edges -->
  <g fill="none" stroke-width="1.5">
    <path d="M96 194 H124" stroke="currentColor" stroke-opacity="0.55" marker-end="url(#a-fg)"/>
    <path d="M400 194 H446" stroke="currentColor" stroke-opacity="0.55" marker-end="url(#a-fg)"/>
    <path d="M602 194 H630" stroke="currentColor" stroke-opacity="0.55" marker-end="url(#a-fg)"/>
    <path d="M700 146 V110 H784" stroke="#2f9e44" stroke-width="1.7" marker-end="url(#a-local)"/>
    <path d="M700 242 V288 H784" stroke="#d97706" stroke-width="1.7" marker-end="url(#a-frontier)"/>
    <path d="M865 314 V346" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-frontier)"/>
  </g>

  <!-- text -->
  <g fill="currentColor">
    <text x="58" y="199" font-size="13" text-anchor="middle">prompt</text>

    <text x="146" y="108" font-size="10" letter-spacing="0.09em" fill-opacity="0.55">LOCAL TIER · IN-PROCESS · $0</text>
    <text x="146" y="126" font-size="10" fill-opacity="0.62">qwen2.5-0.5b · temperature 0.7 · fixed seeds</text>
    <text x="265" y="161" font-size="11.5" text-anchor="middle">draft 1 · seed 11</text>
    <text x="265" y="199" font-size="11.5" text-anchor="middle">draft 2 · seed 22</text>
    <text x="265" y="237" font-size="11.5" text-anchor="middle">draft 3 · seed 33</text>
    <text x="146" y="278" font-size="10" fill-opacity="0.62">&#60;think&#62; blocks stripped before scoring</text>
    <text x="146" y="294" font-size="10" fill-opacity="0.62">no streaming — the decision precedes output</text>

    <text x="423" y="186" font-size="10" text-anchor="middle" fill-opacity="0.62">3 drafts</text>
    <text x="527" y="189" font-size="13" text-anchor="middle">agreement</text>
    <text x="527" y="207" font-size="9.5" text-anchor="middle" fill-opacity="0.62">mean pairwise overlap</text>

    <text x="700" y="191" font-size="13" text-anchor="middle">≥ 0.76?</text>
    <text x="700" y="207" font-size="9" text-anchor="middle" fill-opacity="0.62">threshold</text>

    <text x="708" y="102" font-size="10.5">confident</text>
    <text x="865" y="106" font-size="12" text-anchor="middle">print medoid draft</text>
    <text x="865" y="123" font-size="10" text-anchor="middle" fill-opacity="0.62">0 frontier tokens</text>

    <text x="690" y="264" font-size="10.5" text-anchor="end">agreement &#60; 0.76</text>
    <text x="690" y="279" font-size="10" text-anchor="end" fill-opacity="0.62">or disqualified</text>
    <text x="742" y="280" font-size="10" text-anchor="middle">+ 3 drafts</text>
    <text x="865" y="284" font-size="12" text-anchor="middle">claude-opus-5</text>
    <text x="865" y="301" font-size="10" text-anchor="middle" fill-opacity="0.62">streamed</text>

    <text x="874" y="336" font-size="10" fill-opacity="0.62">on failure</text>
    <text x="580" y="378" font-size="10.5">escalation fails — no credentials, network, rate limit</text>
    <text x="580" y="396" font-size="10.5">→ retract the notice, warn, then print the local draft</text>
    <text x="580" y="414" font-size="10" fill-opacity="0.62">recorded as a failed escalation, never as a local success</text>
  </g>
</svg>
